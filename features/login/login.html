<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aura Store - Sign In</title>
    <link rel="stylesheet" href="../../shared/style.css">
    <link rel="stylesheet" href="login.css">
</head>
<body>

    <nav class="app-nav">
        <a href="../../index.html" class="brand-logo">
            <span class="brand-badge">AURA</span>
            E-Commerce
        </a>
        <div class="nav-links">
            <a href="../../index.html" class="nav-link">← Hub</a>
            <span class="branch-indicator">
                <span class="branch-dot"></span>
                Branch: feature/login
            </span>
        </div>
    </nav>

    <main class="login-container">
        <div class="glass-card">
            <div class="auth-header">
                <h2>Welcome Back</h2>
                <p>Sign in to access your Aura orders and wishlist</p>
            </div>

            <div class="social-login-grid">
                <button type="button" class="btn-social" id="btn-google">
                    <span>🌐</span> Google
                </button>
                <button type="button" class="btn-social" id="btn-github">
                    <span>🐙</span> GitHub
                </button>
            </div>

            <div class="divider">or continue with email</div>

            <div id="status-box" class="status-alert"></div>

            <form id="login-form">
                <div class="input-group">
                    <label class="input-label" for="login-email">Email Address</label>
                    <input type="email" id="login-email" class="input-field" placeholder="alex@aurastore.io" required>
                </div>

                <div class="input-group">
                    <label class="input-label" for="login-password">Password</label>
                    <input type="password" id="login-password" class="input-field" placeholder="••••••••" required>
                </div>

                <div class="remember-forgot">
                    <label class="remember-box">
                        <input type="checkbox" id="remember-me">
                        <span>Remember me</span>
                    </label>
                    <a href="#" class="forgot-link">Forgot password?</a>
                </div>

                <button type="submit" class="btn-primary" style="width: 100%;">
                    Sign In to Account
                </button>
            </form>
        </div>
    </main>

    <script src="login.js"></script>
</body>
</html>
